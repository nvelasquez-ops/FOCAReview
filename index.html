<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Review Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{margin:0;padding:0}</style>
</head>
<body>
  <div id="root"></div>
  <script>
/* =============================================================================
 * MATH REVIEW GAME - NOTES FOR FUTURE AI / MAINTAINERS
 * =============================================================================
 * WHAT THIS IS
 *   A single-file, no-build classroom game (React 18 UMD + Tailwind CDN + KaTeX).
 *   2-4 players share one screen. Before each question every player secretly
 *   wagers a point value. Everyone solves on paper, then self-checks. Correct
 *   players win their wager. One correct player is randomly picked to explain
 *   (+1 bonus point).
 *
 * HOW THE FILE IS ORGANIZED
 *   1. EDITABLE SECTION  - DEBUG_MODE, REFLECTION_MODE, POINT_SETTINGS,
 *                          HIDE_USED_WAGERS, QUESTIONS. Teachers edit only this.
 *   2. Pure helper functions (no React) - wager option generation, round math.
 *   3. App component - state, effects, handlers, then one `if (screen === ...)`
 *      block per screen. Everything is rendered with React.createElement (`h`)
 *      because there is no JSX compiler in this file.
 *
 * SCREEN FLOW (state variable `screen`)
 *   debug (only if DEBUG_MODE) -> setup -> rules -> pointwager -> question
 *     -> selfcheck -> [explain -> (reflection if REFLECTION_MODE) -> bonus]
 *     -> pointwager (next question) ... -> results -> (Play Again) -> setup
 *   "explain" is skipped when nobody answered correctly.
 *   "End Early" on the pointwager screen jumps straight to results.
 *
 * WAGER RULES (this is the part that was buggy before - read carefully)
 *   - Wager options are generated ONCE PER ROUND, not once per question.
 *     A round = POINT_SETTINGS.questionsPerRound questions. All players see the
 *     same options in a round, drawn from POINT_SETTINGS.rounds[roundIndex].
 *   - Each player may use each option once per round. Once a wager is
 *     locked in (Start Question), it is recorded in `usedWagers` for that
 *     player and disappears from that player's choices (or shows struck-through
 *     if HIDE_USED_WAGERS is false) for the rest of the round.
 *   - At the first question of every round, options are regenerated and
 *     `usedWagers` is cleared.
 *
 * !! KEY GOTCHA: STALE STATE !!
 *   React state setters do not update the variable in the current closure.
 *   `setQIndex(qIndex + 1); doSomething();` -> doSomething still sees the OLD
 *   qIndex. That was the original bug: the old code called R(r+1) then Q(),
 *   and Q() read the old `r`, so used wagers were wiped at the wrong time and
 *   round ranges lagged one question behind. FIX: goToWager(nextIndex) takes
 *   the new question index as an ARGUMENT and never reads qIndex for the
 *   upcoming question. Keep that pattern for any new transition logic.
 *
 * DATA SHAPES
 *   players[]         : { name, pts, id }   (id === its index in the array)
 *   wagers            : { [playerId]: number }       current question only
 *   correctness       : { [playerId]: true|false }   current question only
 *   usedWagers        : { [playerId]: number[] }     current round only
 *   wagerOptions      : number[]                     current round only
 *   QUESTIONS[i]      : { topic, q (KaTeX string), a (string), t (seconds) }
 *
 * CONVENTIONS
 *   - Never mutate state objects; always copy ({...x} / .map / .slice).
 *   - All hooks stay at the TOP of App, before any conditional `return`
 *     (React's rules of hooks).
 *   - Questions/answers go through dangerouslySetInnerHTML so KaTeX can render
 *     \( ... \) math. Only put trusted text in QUESTIONS.
 * ============================================================================= */

// ===== EDIT YOUR GAME MODE HERE =====
var DEBUG_MODE = false;       // true = show an answer-key viewer instead of the game
var REFLECTION_MODE = false;  // true = add a 90s written-reflection screen after explanations

// When true, a wager a player already used this round is removed from their
// choices. When false, it stays visible but greyed out and struck through.
var HIDE_USED_WAGERS = true;

// POINT MODE SETTINGS
var POINT_SETTINGS = {
  startPts: 0,            // points every player starts with
  questionsPerRound: 3,   // wager options reset every this-many questions
  rounds: [               // [min, max] wager values for each round (last one repeats)
    [1, 4],
    [4, 7],
    [7, 10]
  ]
};

// ===== EDIT YOUR QUESTIONS HERE =====
var QUESTIONS = [
  {topic: "Reducing Polynomial Fraction", q: "\\( \\frac{1}{7x^3} \\cdot \\frac{x^2}{2} \\)", a: "\\( \\frac{1}{14x}\\)", t: 90},
  {topic: "Factoring and Reducing a Polynomial Fraction", q: "\\( \\frac{x^2+x-30}{x^2-3x-54} \\)", a: "\\( \\frac{x-5}{x-9} \\)", t: 120},
  {topic: "Multiplying Polynomials", q: "\\( \\frac{x-2}{x+1}\\cdot \\frac{x^2-1}{3x^2-2x-8} \\)", a: "\\( \\frac{x-1}{3x+4} \\)", t: 180},
  {topic: "Subtracting Polynomials", q: "\\( \\frac{3}{x+2}-\\frac{1}{x} \\)", a: "\\( \\frac{2x-2}{x(x+2)} \\)", t: 180},
  {topic: "Subtracting Polynomials", q: "\\( \\frac{1}{x-4}-\\frac{5x+3}{x^2-16} \\)", a: "\\( \\frac{-4x+1}{(x+4)(x-4)} \\)", t: 180},
  {topic: "Simplifying Roots", q: "\\( \\sqrt{12x^7y^8} \\)", a: "\\( 2x^3y^4\\sqrt{3x} \\)", t: 45},
  {topic: "Simplifying Roots", q: "\\( \\sqrt[3]{108x^{10}y^4} \\)", a: "\\( 3x^3y\\sqrt[3]{4xy} \\)", t: 180}
];
// ===== END EDITABLE SECTION =====


// ----------------------------------------------------------------------------
// Pure helpers (no React, no state)
// ----------------------------------------------------------------------------
var h = React.createElement;            // shorthand: h(tag, props, ...children)
var useState = React.useState;
var useEffect = React.useEffect;

// Inclusive random integer between min and max.
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Which round (0-based) a question index belongs to.
function getRoundIndex(questionIndex) {
  return Math.floor(questionIndex / POINT_SETTINGS.questionsPerRound);
}

// True when this question is the first of a round (options must be regenerated).
function isRoundStart(questionIndex) {
  return questionIndex % POINT_SETTINGS.questionsPerRound === 0;
}

// Returns a sorted array of unique random wager values for the round that
// contains `questionIndex`. One option per question in the round, capped by
// how many distinct values the [min, max] range can actually supply.
function generateWagerOptions(questionIndex) {
  var rounds = POINT_SETTINGS.rounds;
  var range = rounds[getRoundIndex(questionIndex)] || rounds[rounds.length - 1];
  var count = Math.min(POINT_SETTINGS.questionsPerRound, range[1] - range[0] + 1);
  var options = [];
  var seen = {};
  while (options.length < count) {
    var value = getRandomInt(range[0], range[1]);
    if (!seen[value]) {
      seen[value] = true;
      options.push(value);
    }
  }
  return options.sort(function (a, b) { return a - b; });
}


function App() {
  // --------------------------------------------------------------------------
  // STATE (all hooks first - do not put hooks after a conditional return)
  // --------------------------------------------------------------------------
  var [screen, setScreen] = useState(DEBUG_MODE ? 'debug' : 'setup');
  var [debugIndex, setDebugIndex] = useState(0);              // question shown in debug viewer
  var [playerCount, setPlayerCount] = useState(2);            // 2-4
  var [playerNames, setPlayerNames] = useState(['Player 1', 'Player 2']); // setup-screen inputs
  var [players, setPlayers] = useState([]);                   // live game roster: {name, pts, id}
  var [qIndex, setQIndex] = useState(0);                      // current question index
  var [timeLeft, setTimeLeft] = useState(30);                 // question countdown (seconds)
  var [timerRunning, setTimerRunning] = useState(false);      // true only on the question screen
  var [wagers, setWagers] = useState({});                     // {playerId: wager} this question
  var [correctness, setCorrectness] = useState({});           // {playerId: true|false} this question
  var [explainerId, setExplainerId] = useState(null);         // player chosen to explain
  var [reflectionTime, setReflectionTime] = useState(90);     // reflection countdown (seconds)
  var [wagerOptions, setWagerOptions] = useState([]);         // shared options for the current round
  var [usedWagers, setUsedWagers] = useState({});             // {playerId: number[]} used this round

  // --------------------------------------------------------------------------
  // EFFECTS
  // --------------------------------------------------------------------------
  // Question countdown. Stops (does not auto-advance) at 0; teacher clicks "Everyone Done".
  useEffect(function () {
    if (!timerRunning) return;
    if (timeLeft === 0) { setTimerRunning(false); return; }
    var id = setTimeout(function () { setTimeLeft(timeLeft - 1); }, 1000);
    return function () { clearTimeout(id); };
  }, [timeLeft, timerRunning]);

  // Reflection countdown (only ticks while on the reflection screen).
  useEffect(function () {
    if (screen !== 'reflection' || reflectionTime <= 0) return;
    var id = setTimeout(function () { setReflectionTime(reflectionTime - 1); }, 1000);
    return function () { clearTimeout(id); };
  }, [reflectionTime, screen]);

  // Re-run KaTeX on the page whenever a screen/question that shows math changes.
  // NOTE: katex.js and auto-render.js are loaded with `defer` from a CDN, so they can
  // arrive AFTER the first render. We therefore poll (every 100ms, up to ~10s) until
  // window.renderMathInElement exists instead of checking once. A single check was the
  // cause of raw "\\( ... \\)" text showing on the first screen.
  useEffect(function () {
    var timeoutId = null;
    var cancelled = false;
    function tryRender(attemptsLeft) {
      if (cancelled) return;
      if (window.renderMathInElement) {
        window.renderMathInElement(document.body, {delimiters: [{left: "\\(", right: "\\)", display: false}]});
      } else if (attemptsLeft > 0) {
        timeoutId = setTimeout(function () { tryRender(attemptsLeft - 1); }, 100);
      }
    }
    timeoutId = setTimeout(function () { tryRender(100); }, 50);
    return function () { cancelled = true; clearTimeout(timeoutId); };
  }, [screen, debugIndex, qIndex]);

  // --------------------------------------------------------------------------
  // HANDLERS
  // --------------------------------------------------------------------------
  // Setup screen: change number of players, keeping names already typed.
  function changePlayerCount(count) {
    var names = [];
    for (var j = 0; j < count; j++) names.push(playerNames[j] || 'Player ' + (j + 1));
    setPlayerCount(count);
    setPlayerNames(names);
  }

  // Setup screen: edit one name (blank falls back to "Player N").
  function updateName(index, value) {
    var names = playerNames.slice();
    names[index] = value || 'Player ' + (index + 1);
    setPlayerNames(names);
  }

  // Setup -> rules. Builds the roster.
  function startGame() {
    setPlayers(playerNames.map(function (name, j) {
      return {name: name || 'Player ' + (j + 1), pts: POINT_SETTINGS.startPts, id: j};
    }));
    setScreen('rules');
  }

  // Go to the wager screen for question `nextIndex`.
  // IMPORTANT: takes the index as an argument (see STALE STATE note at top).
  function goToWager(nextIndex) {
    setQIndex(nextIndex);
    setWagers({});
    setCorrectness({});
    if (isRoundStart(nextIndex)) {          // new round: fresh options, nobody has used any
      setWagerOptions(generateWagerOptions(nextIndex));
      setUsedWagers({});
    }
    setScreen('pointwager');
  }

  // Wager screen: highlight a player's chosen wager (can be changed until the question starts).
  function chooseWager(playerId, value) {
    setWagers(function (prev) {
      var next = Object.assign({}, prev);
      next[playerId] = value;
      return next;
    });
  }

  // Wager screen -> question. Locks the wagers in: they are now "used" for this round.
  function startQuestion() {
    var nextUsed = Object.assign({}, usedWagers);
    players.forEach(function (p) {
      var list = (nextUsed[p.id] || []).slice();
      if (list.indexOf(wagers[p.id]) === -1) list.push(wagers[p.id]);
      nextUsed[p.id] = list;
    });
    setUsedWagers(nextUsed);
    setTimeLeft(QUESTIONS[qIndex].t);
    setTimerRunning(true);
    setScreen('question');
  }

  // Question -> self-check.
  function everyoneDone() {
    setTimerRunning(false);
    setScreen('selfcheck');
  }

  // Self-check: record whether a player got the question right.
  function markAnswer(playerId, isCorrect) {
    setCorrectness(function (prev) {
      var next = Object.assign({}, prev);
      next[playerId] = isCorrect;
      return next;
    });
  }

  // Move on after a question is fully finished (scored/explained).
  function advance() {
    if (qIndex + 1 < QUESTIONS.length) goToWager(qIndex + 1);
    else setScreen('results');
  }

  // Self-check -> award wagers -> explain screen (or next question if nobody was right).
  function applyScores() {
    var correctIds = [];
    var updated = players.map(function (p) {
      if (correctness[p.id]) {
        correctIds.push(p.id);
        return {name: p.name, pts: p.pts + wagers[p.id], id: p.id};
      }
      return p;
    });
    setPlayers(updated);
    if (correctIds.length > 0) {
      setExplainerId(correctIds[Math.floor(Math.random() * correctIds.length)]);
      setScreen('explain');
    } else {
      advance();
    }
  }

  // Explain screen -> +1 bonus point for the explainer -> reflection or bonus screen.
  function finishExplanation() {
    setPlayers(players.map(function (p) {
      return p.id === explainerId ? {name: p.name, pts: p.pts + 1, id: p.id} : p;
    }));
    if (REFLECTION_MODE) {
      setReflectionTime(90);
      setScreen('reflection');
    } else {
      setScreen('bonus');
    }
  }

  // Back to the very start (Play Again).
  function resetGame() {
    setScreen(DEBUG_MODE ? 'debug' : 'setup');
    setQIndex(0);
    setWagers({});
    setCorrectness({});
    setExplainerId(null);
    setDebugIndex(0);
    setWagerOptions([]);
    setUsedWagers({});
    setTimerRunning(false);
  }

  // --------------------------------------------------------------------------
  // SCREENS
  // --------------------------------------------------------------------------
  if (screen === 'debug') {
    var debugQ = QUESTIONS[debugIndex];
    return h('div', {className: "min-h-screen bg-blue-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-4xl w-full"},
        h('div', {className: "bg-yellow-100 p-4 mb-6"},
          h('p', {className: "font-bold"}, '🔧 DEBUG MODE'),
          h('p', {className: "text-sm"}, 'Set DEBUG_MODE=false to play')),
        h('div', {className: "text-center mb-6"},
          h('h2', {className: "text-2xl font-bold mb-2"}, 'Question ' + (debugIndex + 1) + ' of ' + QUESTIONS.length),
          h('p', null, 'Time: ' + debugQ.t + 's')),
        h('div', {className: "bg-purple-50 rounded-xl p-8 mb-6"},
          h('h3', {className: "text-lg font-semibold mb-3"}, 'Question:'),
          h('div', {className: "text-4xl font-bold text-center mb-6", dangerouslySetInnerHTML: {__html: debugQ.q}}),
          h('h3', {className: "text-lg font-semibold mb-3"}, 'Answer:'),
          h('div', {className: "text-3xl font-bold text-green-700 text-center", dangerouslySetInnerHTML: {__html: debugQ.a}})),
        h('div', {className: "flex space-x-3"},
          h('button', {onClick: function () { setDebugIndex(Math.max(0, debugIndex - 1)); }, disabled: debugIndex === 0, className: "flex-1 bg-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-400 disabled:opacity-50"}, '← Prev'),
          h('button', {onClick: function () { setDebugIndex(Math.min(QUESTIONS.length - 1, debugIndex + 1)); }, disabled: debugIndex === QUESTIONS.length - 1, className: "flex-1 bg-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-400 disabled:opacity-50"}, 'Next →')),
        h('button', {onClick: function () { setScreen('setup'); }, className: "w-full mt-4 bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Exit Debug & Start')));
  }

  if (screen === 'setup') {
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-md w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '🏆'),
          h('h1', {className: "text-3xl font-bold"}, 'Math Review Game')),
        h('div', {className: "space-y-6"},
          h('div', null,
            h('label', {className: "block text-sm font-medium mb-2"}, 'Players (2-4)'),
            h('div', {className: "flex items-center justify-center space-x-4"},
              h('button', {onClick: function () { changePlayerCount(Math.max(2, playerCount - 1)); }, className: "bg-gray-200 p-2 rounded-lg hover:bg-gray-300 text-xl font-bold w-10 h-10"}, '-'),
              h('span', {className: "text-2xl font-bold w-12 text-center"}, playerCount),
              h('button', {onClick: function () { changePlayerCount(Math.min(4, playerCount + 1)); }, className: "bg-gray-200 p-2 rounded-lg hover:bg-gray-300 text-xl font-bold w-10 h-10"}, '+'))),
          h('div', null,
            h('label', {className: "block text-sm font-medium mb-2"}, 'Names'),
            playerNames.map(function (name, j) {
              return h('input', {key: j, type: "text", value: name, onChange: function (ev) { updateName(j, ev.target.value); }, className: "w-full mb-2 px-3 py-2 border-2 rounded-lg focus:border-purple-500 focus:outline-none", placeholder: 'Player ' + (j + 1)});
            })),
          h('button', {onClick: startGame, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Start Game'))));
  }

  if (screen === 'rules') {
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-2xl w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '📖'),
          h('h1', {className: "text-3xl font-bold"}, 'Game Rules')),
        h('div', {className: "space-y-4 text-lg mb-8"},
          h('p', null, '🎯 Start with ' + POINT_SETTINGS.startPts + ' points'),
          h('p', null, '💰 Choose a point value before each question'),
          h('p', null, '✅ Correct? Win those points!'),
          h('p', null, '❌ Wrong? No points earned'),
          h('p', null, '🔄 Point options reset every ' + POINT_SETTINGS.questionsPerRound + ' questions'),
          h('p', null, '🌟 Explain? Earn bonus point!'),
          h('p', {className: "text-red-600 font-bold"}, '⚠️ DON\'T ERASE ANSWERS!')),
        h('button', {onClick: function () { goToWager(0); }, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Let\'s Play!')));
  }

  if (screen === 'pointwager') {
    var wagerQ = QUESTIONS[qIndex];
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-2xl w-full"},
        h('div', {className: "text-center mb-6"},
          h('h1', {className: "text-3xl font-bold"}, 'Choose Point Value'),
          h('p', {className: "text-gray-600 mt-2"}, 'Question ' + (qIndex + 1) + ' (Round ' + (getRoundIndex(qIndex) + 1) + ')'),
          wagerQ.topic && h('div', {className: "mt-4 bg-purple-100 rounded-lg p-3"},
            h('p', {className: "text-sm text-gray-600"}, 'Topic:'),
            h('p', {className: "text-xl font-bold text-purple-700"}, wagerQ.topic))),
        h('div', {className: "grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"},
          players.map(function (player) {
            var usedByPlayer = usedWagers[player.id] || [];
            // Safety net: if a player somehow used every option (tiny wager range), let them reuse.
            var allUsed = wagerOptions.every(function (val) { return usedByPlayer.indexOf(val) !== -1; });
            // Options this player still sees. Used ones are dropped entirely when HIDE_USED_WAGERS is true.
            var visibleOptions = wagerOptions.filter(function (val) {
              return !(HIDE_USED_WAGERS && !allUsed && usedByPlayer.indexOf(val) !== -1);
            });
            return h('div', {key: player.id, className: "bg-gray-50 p-6 rounded-xl"},
              h('div', {className: "flex justify-between mb-4"},
                h('h3', {className: "text-xl font-bold"}, player.name),
                h('span', {className: "text-lg font-semibold text-purple-600"}, player.pts + ' pts')),
              h('div', {className: "text-sm mb-3"}, 'Choose:'),
              h('div', {className: "flex gap-2"},
                visibleOptions.map(function (val) {
                  var isUsed = !allUsed && usedByPlayer.indexOf(val) !== -1; // only reachable when HIDE_USED_WAGERS is false
                  var isSelected = wagers[player.id] === val;
                  var cls = isSelected
                    ? 'flex-1 py-3 rounded-lg font-bold text-xl bg-purple-600 text-white'
                    : isUsed
                      ? 'flex-1 py-3 rounded-lg font-bold text-xl bg-gray-300 text-gray-500 line-through cursor-not-allowed'
                      : 'flex-1 py-3 rounded-lg font-bold text-xl bg-gray-200 hover:bg-purple-100';
                  return h('button', {key: val, onClick: function () { if (!isUsed) chooseWager(player.id, val); }, disabled: isUsed, className: cls}, val);
                })));
          })),
        h('button', {onClick: startQuestion, disabled: Object.keys(wagers).length !== players.length, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 mb-3 disabled:opacity-50"}, 'Start Question'),
        qIndex > 0 && h('button', {onClick: function () { setScreen('results'); }, className: "w-full bg-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-400"}, 'End Early')));
  }

  if (screen === 'question') {
    var questionQ = QUESTIONS[qIndex];
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-4xl w-full"},
        h('div', {className: "flex justify-between mb-8"},
          h('h2', {className: "text-2xl font-bold"}, 'Solve'),
          h('div', {className: "flex items-center space-x-2"},
            h('span', {className: "text-2xl"}, '⏰'),
            h('span', {className: timeLeft <= 5 ? 'font-bold text-3xl text-red-600' : 'font-bold text-3xl'}, timeLeft + 's'))),
        h('div', {className: "bg-blue-50 rounded-xl p-12 mb-8"},
          h('div', {className: "text-center"},
            h('div', {className: "text-6xl font-bold mb-4", dangerouslySetInnerHTML: {__html: questionQ.q}}),
            h('p', {className: "text-lg text-gray-600"}, 'Write answer - don\'t erase!'))),
        h('button', {onClick: everyoneDone, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Everyone Done')));
  }

  if (screen === 'selfcheck') {
    var checkQ = QUESTIONS[qIndex];
    // Continue is enabled only once every player has been marked correct or wrong.
    var allMarked = players.every(function (p) { return correctness[p.id] !== undefined; });
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-4xl w-full"},
        h('div', {className: "text-center mb-8"},
          h('h1', {className: "text-3xl font-bold mb-6"}, 'Check Answers'),
          h('div', {className: "text-4xl font-bold text-gray-700 mb-4", dangerouslySetInnerHTML: {__html: checkQ.q}}),
          h('div', {className: "text-5xl font-bold text-purple-600 mt-6", dangerouslySetInnerHTML: {__html: checkQ.a}})),
        h('div', {className: "space-y-4 mb-8"},
          players.map(function (player) {
            return h('div', {key: player.id, className: "bg-gray-50 p-6 rounded-xl"},
              h('div', {className: "flex justify-between items-center"},
                h('div', null,
                  h('h3', {className: "text-xl font-bold"}, player.name),
                  h('p', {className: "text-sm text-gray-600"}, 'Wagered: ' + (wagers[player.id] || 1))),
                h('div', {className: "flex space-x-3"},
                  h('button', {onClick: function () { markAnswer(player.id, true); }, className: correctness[player.id] === true ? 'px-6 py-3 rounded-lg font-semibold bg-green-500 text-white' : 'px-6 py-3 rounded-lg font-semibold bg-gray-200 hover:bg-green-100'}, '✓ Correct'),
                  h('button', {onClick: function () { markAnswer(player.id, false); }, className: correctness[player.id] === false ? 'px-6 py-3 rounded-lg font-semibold bg-red-500 text-white' : 'px-6 py-3 rounded-lg font-semibold bg-gray-200 hover:bg-red-100'}, '✗ Wrong'))));
          })),
        h('button', {onClick: applyScores, disabled: !allMarked, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:opacity-50"}, 'Continue')));
  }

  if (screen === 'explain') {
    var explainQ = QUESTIONS[qIndex];
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-4xl w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '🎤'),
          h('h1', {className: "text-3xl font-bold"}, players[explainerId].name + ', explain!'),
          h('div', {className: "mt-6"},
            h('p', {className: "text-lg text-gray-600 mb-2"}, 'Question:'),
            h('div', {className: "text-2xl font-bold text-gray-700 mb-4", dangerouslySetInnerHTML: {__html: explainQ.q}}),
            h('p', {className: "text-lg text-gray-600 mb-2"}, 'Answer:'),
            h('div', {className: "text-2xl font-bold text-purple-600", dangerouslySetInnerHTML: {__html: explainQ.a}}))),
        h('div', {className: "bg-blue-50 p-6 rounded-xl mb-8"},
          h('p', {className: "text-lg text-center"}, 'Walk through your thinking!')),
        h('button', {onClick: finishExplanation, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Done')));
  }

  if (screen === 'reflection') {
    var reflectQ = QUESTIONS[qIndex];
    var clock = Math.floor(reflectionTime / 60) + ':' + (reflectionTime % 60 < 10 ? '0' : '') + (reflectionTime % 60);
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-4xl w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '✍️'),
          h('h1', {className: "text-3xl font-bold"}, 'Reflection Time'),
          h('div', {className: "flex items-center justify-center space-x-2 mt-4"},
            h('span', {className: "text-2xl"}, '⏰'),
            h('span', {className: reflectionTime <= 10 ? 'font-bold text-4xl text-red-600' : 'font-bold text-4xl text-purple-600'}, clock))),
        h('div', {className: "bg-blue-50 p-6 rounded-xl mb-6"},
          h('p', {className: "text-xl text-center font-semibold mb-4"}, 'Reflect on this problem in writing.'),
          h('p', {className: "text-lg text-center"}, 'Use sentence stems posted in class.')),
        h('div', {className: "bg-purple-50 rounded-xl p-6 mb-6"},
          h('p', {className: "text-lg text-gray-600 mb-2 text-center"}, 'Question:'),
          h('div', {className: "text-2xl font-bold text-center mb-4", dangerouslySetInnerHTML: {__html: reflectQ.q}}),
          h('p', {className: "text-lg text-gray-600 mb-2 text-center"}, 'Answer:'),
          h('div', {className: "text-2xl font-bold text-purple-600 text-center", dangerouslySetInnerHTML: {__html: reflectQ.a}})),
        h('button', {onClick: function () { setScreen('bonus'); }, disabled: reflectionTime > 0, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:opacity-50"}, reflectionTime > 0 ? 'Reflecting... (' + clock + ')' : 'Continue')));
  }

  if (screen === 'bonus') {
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-2xl w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '⭐'),
          h('h1', {className: "text-3xl font-bold"}, 'Thanks, ' + players[explainerId].name + '!'),
          h('p', {className: "text-xl text-gray-600 mt-4"}, 'Bonus point!')),
        h('button', {onClick: advance, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Next Round')));
  }

  if (screen === 'results') {
    var ranked = players.slice().sort(function (a, b) { return b.pts - a.pts; });
    return h('div', {className: "min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4"},
      h('div', {className: "bg-white rounded-2xl p-8 max-w-md w-full"},
        h('div', {className: "text-center mb-8"},
          h('div', {className: "text-6xl mb-4"}, '🏆'),
          h('h1', {className: "text-3xl font-bold"}, 'Final Results')),
        h('div', {className: "space-y-4 mb-8"},
          ranked.map(function (player, rank) {
            return h('div', {key: player.id, className: rank === 0 ? 'flex items-center justify-between p-4 rounded-lg bg-yellow-100 border-2 border-yellow-400' : 'flex items-center justify-between p-4 rounded-lg bg-gray-100'},
              h('div', {className: "flex items-center space-x-3"},
                h('span', {className: "text-2xl font-bold text-gray-500"}, '#' + (rank + 1)),
                h('span', {className: "font-semibold"}, player.name)),
              h('span', {className: "text-xl font-bold text-purple-600"}, player.pts + ' pts'));
          })),
        h('button', {onClick: resetGame, className: "w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"}, 'Play Again')));
  }

  return null; // unknown screen name (should never happen)
}

ReactDOM.render(h(App), document.getElementById('root'));
  </script>
</body>
</html>
